name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ultracite check
        run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:skill -- --check
      - run: npm test
      - name: Smoke packed/global and npx installs
        run: |
          pkg="$(npm pack --pack-destination "$RUNNER_TEMP")"
          tarball="$RUNNER_TEMP/$pkg"
          expected="$(node -p "require('./package.json').version")"

          npm install -g "$tarball"
          test "$(pypi-axi --version)" = "$expected"

          test "$(npm exec --yes --package "$tarball" -- pypi-axi --version)" = "$expected"
