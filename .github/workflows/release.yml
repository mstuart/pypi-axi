name: Release

# Manual release: run from the Actions tab (or `gh workflow run release.yml -f bump=patch`).
# Publishes to npm with provenance via OIDC trusted publishing — no NPM_TOKEN secret.
# One-time setup per package: npmjs.com → package → Settings → Trusted Publisher → GitHub Actions.
# Failure ordering: publish happens before pushing the release commit/tag, so a failed publish
# cannot leave a new git tag that claims an npm release exists.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5; npm 12 needs Node 22+, so pin 11)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:skill -- --check
      - run: npm test
      - name: Smoke packed/global and npx installs
        run: |
          pkg="$(npm pack --pack-destination "$RUNNER_TEMP")"
          tarball="$RUNNER_TEMP/$pkg"
          expected="$(node -p "require('./package.json').version")"

          npm install -g "$tarball"
          test "$(pypi-axi --version)" = "$expected"

          test "$(npm exec --yes --package "$tarball" -- pypi-axi --version)" = "$expected"
      - name: Configure git identity
        run: |
          git config user.name "Mark Stuart"
          git config user.email "742884+mstuart@users.noreply.github.com"
      - name: Bump version locally
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          tag="v$(node -p "require('./package.json').version")"
          if npm view "pypi-axi@${tag#v}" version >/dev/null 2>&1; then
            echo "npm version ${tag#v} already exists; choose a larger bump or recover git tags/docs manually" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "git tag $tag already exists; choose a larger bump or recover npm/git state manually" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (provenance, OIDC — no token)
        run: npm publish --provenance --access public
      - name: Commit, tag, and push after publish succeeds
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --title "${{ steps.bump.outputs.tag }}" --generate-notes
